version: '3.8'

# Simple IPv6 setup for Supabase
networks:
  default:
    enable_ipv6: true

services:
  # Airflow Standalone (connecté à Supabase)
  airflow:
    image: apache/airflow:2.8.1
    command: standalone
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # Variables Supabase pour les DAGs
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL}
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scrapers:/opt/airflow/scrapers
      - airflow_data:/opt/airflow
    env_file:
      - .env
    dns:
      - 8.8.8.8  # Google DNS pour résolution fiable
      - 1.1.1.1  # Cloudflare DNS backup

  # API FastAPI pour exposer les données (connectée à Supabase)
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${SUPABASE_DATABASE_URL}
      PYTHONPATH: /app
      # Variables Supabase individuelles (backup)
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
    volumes:
      - ./api/src:/app/src
    env_file:
      - .env
    restart: unless-stopped

volumes:
  airflow_data:
